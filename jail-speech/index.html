<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Jail Speech — Memory Restored</title>
    <meta name="description" content="A childhood speech contest entry from 1998, naturally restored from VHS.">
    
    <meta property="og:title" content="The Jail Speech — Memory Restored">
    <meta property="og:description" content="'Be smart, don't do drugs, and stay in school.' — Tim, 1998">
    <meta property="og:image" content="images/poster.jpg">
    <meta name="theme-color" content="#0a0806">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0806;
            --text: #fff8f0;
            --text-dim: rgba(255, 248, 240, 0.5);
            --accent: #f5a623;
            --accent-glow: rgba(245, 166, 35, 0.4);
            --vhs-warm: #fcb69f;
            --green: #4ade80;
            --red: #f87171;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Grain */
        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.015;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        
        /* Loading */
        .loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.6s ease;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        
        .loading-ring {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(245, 166, 35, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text {
            margin-top: 1rem;
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        
        body.archive-mode .controls .btn,
        body.archive-mode .progress-area,
        body.archive-mode .vol { display: none !important; }
        body.archive-mode .video-layer { object-fit: cover; width: 100%; height: 100%; }
        .archive-chips { position: absolute; left: 50%; transform: translateX(-50%);
            bottom: 96px; display: flex; gap: 14px; align-items: center; z-index: 30; }
        .archive-note { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim);
            text-transform: uppercase; }
        .archive-group { display: flex; gap: 4px; background: rgba(255,248,240,0.06);
            backdrop-filter: blur(16px); border: 1px solid rgba(255,248,240,0.12);
            border-radius: 8px; padding: 3px; }
        .archive-chip { font: 500 11px/1 'Inter', system-ui, sans-serif; letter-spacing: 0.06em;
            color: var(--text-dim); background: transparent; border: 0; border-radius: 6px;
            padding: 7px 12px; cursor: pointer; transition: color 144ms ease, background 144ms ease; }
        .archive-chip:hover { color: var(--text); }
        .archive-chip.active { color: #0a0806; background: var(--accent); }
        .loading-progress {
            margin-top: 0.6rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent);
        }
        
        /* Start Overlay */
        #startOverlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(20, 12, 8, 0.97) 0%, var(--bg) 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #startOverlay:focus { outline: none; }
        #startOverlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .intro-badge {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.2s;
        }
        
        .badge {
            padding: 0.35rem 0.7rem;
            border-radius: 4px;
            font-size: 0.55rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
        }
        .badge.vhs {
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid var(--red);
            color: var(--red);
        }
        .badge.enhanced {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid var(--green);
            color: var(--green);
        }
        .badge-arrow {
            color: var(--accent);
            font-size: 1rem;
            opacity: 0;
            animation: fadeUp 0.5s ease forwards 0.35s;
        }
        
        .intro-year {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: var(--accent);
            margin-bottom: 0.6rem;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.45s;
        }
        
        #startOverlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 400;
            font-style: italic;
            opacity: 0;
            animation: titleReveal 1s ease forwards 0.6s;
            text-align: center;
        }
        
        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--text-dim);
            margin-top: 0.6rem;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 1s;
        }
        
        .start-hint {
            position: absolute;
            bottom: 8%;
            font-size: 0.5rem;
            letter-spacing: 0.2em;
            color: var(--text-dim);
            text-transform: uppercase;
            opacity: 0;
            animation: pulse 2s ease-in-out infinite, fadeUp 0.8s ease forwards 1.3s;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes titleReveal {
            0% { opacity: 0; transform: scale(0.94) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }
        
        /* Player Container */
        .player {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.6s ease;
        }
        .player.active { 
            opacity: 1; 
            pointer-events: auto;
        }
        
        .video-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 4 / 3);
            cursor: ew-resize;
        }
        
        /* Video Layers */
        .video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #videoOriginal { 
            z-index: 1; 
        }
        
        .enhanced-layer {
            z-index: 2;
            /* Clip from LEFT - shows RIGHT portion (enhanced on right side) */
            clip-path: inset(0 0 0 50%);
            transition: opacity 0.35s ease;
        }
        
        .enhanced-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Blend Divider */
        .divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(180deg, transparent 0%, var(--text) 10%, var(--text) 90%, transparent 100%);
            z-index: 20;
            transform: translateX(-50%);
            box-shadow: 0 0 12px rgba(255, 248, 240, 0.1);
            pointer-events: none;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        
        .divider::after {
            content: '⟷';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            color: var(--text);
            z-index: 1;
        }
        
        .video-frame.dragging { cursor: grabbing; }
        .video-frame.dragging .divider::before {
            transform: translate(-50%, -50%) scale(1.1);
            border-color: var(--accent);
        }
        
        /* Video Labels */
        .labels {
            position: absolute;
            top: 1rem;
            left: 0;
            right: 9rem; /* Room for language buttons */
            display: flex;
            justify-content: space-between;
            padding: 0 1.2rem;
            z-index: 25;
            pointer-events: none;
        }
        
        .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            opacity: 0;
            animation: labelIn 0.4s ease forwards;
        }
        .label.original { color: var(--vhs-warm); animation-delay: 0.15s; }
        .label.enhanced { color: var(--green); animation-delay: 0.25s; }
        @keyframes labelIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 0.8; transform: translateY(0); }
        }
        
        /* Language Switcher */
        .lang-switcher {
            position: fixed;
            top: 0.8rem;
            right: 0.8rem;
            z-index: 200;
            display: flex;
            gap: 0.3rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }
        .lang-switcher.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .lang-btn {
            padding: 0.3rem 0.55rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .lang-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }
        .lang-btn.switching {
            opacity: 0.5;
            pointer-events: none;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           GLASS PANE — Ethereal subtitle + controls
           ═══════════════════════════════════════════════════════════════ */
        
        .glass {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            
            background: linear-gradient(
                to top,
                rgba(10, 8, 6, 0.95) 0%,
                rgba(10, 8, 6, 0.75) 25%,
                rgba(10, 8, 6, 0.4) 50%,
                rgba(10, 8, 6, 0.15) 75%,
                transparent 100%
            );
            
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            
            padding: 0 0 1.2rem 0;
            min-height: 140px;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        .glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 248, 240, 0.08), transparent);
        }
        
        /* Subtitle Area */
        .subtitle-area {
            width: 100%;
            max-width: 680px;
            text-align: center;
            padding: 0.8rem 1.2rem;
            min-height: 3rem;
        }
        
        .subtitle-line {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            font-style: italic;
            line-height: 1.6;
            color: var(--text);
            text-shadow: 
                0 0 20px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(0, 0, 0, 0.6),
                0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.02em;
            animation: subtitleGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes subtitleGlow {
            0% { text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.8); }
            100% { text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 60px rgba(245, 166, 35, 0.1); }
        }
        
        .subtitle-line .word {
            display: inline;
            opacity: 0.5;
            transition: opacity 0.15s ease, color 0.15s ease, text-shadow 0.15s ease;
        }
        
        .subtitle-line .word.spoken {
            opacity: 1;
        }
        
        .subtitle-line .word.current {
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-glow);
        }
        
        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0 1rem;
            width: 100%;
            max-width: 480px;
        }
        
        .btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            opacity: 0.5;
            flex-shrink: 0;
        }
        
        .btn:hover {
            opacity: 1;
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .btn:active { transform: scale(0.95); }
        .btn:focus { outline: none; }
        .btn:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
        
        .btn svg { width: 11px; height: 11px; fill: currentColor; }
        
        .btn.play {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border: none;
            opacity: 1;
            box-shadow: 0 2px 10px rgba(245, 166, 35, 0.2);
        }
        .btn.play:hover {
            transform: scale(1.08);
            box-shadow: 0 3px 14px rgba(245, 166, 35, 0.3);
        }
        .btn.play svg { width: 14px; height: 14px; fill: var(--bg); }
        
        /* Progress */
        .progress-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            max-width: 280px;
        }
        
        .progress-track {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            transition: height 0.12s ease;
        }
        .progress-track:hover { height: 5px; }
        
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.12s ease;
        }
        .progress-track:hover .progress-fill::after { opacity: 1; }
        
        .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-dim);
            white-space: nowrap;
            min-width: 65px;
        }
        
        /* Volume */
        .volume-area {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .volume-slider {
            width: 0;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            outline: none;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .volume-area:hover .volume-slider {
            width: 45px;
            opacity: 1;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }
        
        /* End Overlay */
        #endOverlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, #1a1208 0%, var(--bg) 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 900;
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s ease;
        }
        #endOverlay.visible { opacity: 1; visibility: visible; }
        
        .end-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0;
        }
        #endOverlay.visible .end-icon {
            animation: endPop 0.6s ease forwards 0.2s;
        }
        @keyframes endPop {
            from { opacity: 0; transform: scale(0) rotate(-10deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        .end-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-style: italic;
            margin-bottom: 0.3rem;
            opacity: 0;
            color: #ffecd2;
        }
        #endOverlay.visible .end-title { animation: fadeUp 0.6s ease forwards 0.4s; }
        
        .end-sub {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            opacity: 0;
        }
        #endOverlay.visible .end-sub { animation: fadeUp 0.6s ease forwards 0.6s; }
        
        .replay-btn {
            padding: 0.7rem 1.5rem;
            font-family: inherit;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            opacity: 0;
        }
        #endOverlay.visible .replay-btn { animation: fadeUp 0.6s ease forwards 0.8s; }
        .replay-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        /* Tech whisper */
        .tech {
            position: fixed;
            bottom: 0.4rem;
            left: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.45rem;
            color: var(--text-dim);
            opacity: 0.15;
            z-index: 50;
        }
        .tech span { color: var(--accent); }
        
        /* Seek flash */
        .seek-flash {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            color: var(--text);
            opacity: 0;
            pointer-events: none;
            z-index: 500;
        }
        .seek-flash.show {
            animation: seekPop 0.3s ease forwards;
        }
        @keyframes seekPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            40% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Language transition */
        .lang-flash {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--accent);
            opacity: 0;
            pointer-events: none;
            z-index: 500;
        }
        .lang-flash.show {
            animation: langPop 0.5s ease forwards;
        }
        @keyframes langPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <div class="seek-flash" id="seekFlash"></div>
    <div class="lang-flash" id="langFlash"></div>
    
    <div class="loading" id="loading">
        <div class="loading-ring"></div>
        <div class="loading-text">Preserving Time</div>
        <div class="loading-progress" id="loadProgress">0%</div>
    </div>
    
    <div id="startOverlay" tabindex="0" role="button" aria-label="Click to begin">
        <div class="intro-badge">
            <span class="badge vhs">VHS 640×480</span>
            <span class="badge-arrow">→</span>
            <span class="badge enhanced">2K 2560×1920</span>
        </div>
        <div class="intro-year">≈ 1998</div>
        <h1>"The Jail Speech"</h1>
        <div class="subtitle">Natural Restoration · Texture Preserved</div>
        <div class="start-hint">Click anywhere to begin</div>
    </div>
    
    <div class="player" id="player">
        <div class="video-frame" id="videoFrame">
            <!-- Original VHS (left side, always visible, muted) -->

        // page at "PRESERVING TIME 0%" forever.
        const allVideos = [videoOriginal, videoEN, videoES, videoJA];
        let loaded = 0;

        const settle = (v) => new Promise(resolve => {
            let done = false;
            const ok = () => { if (done) return; done = true; loaded++;
                loadProgress.textContent = Math.round((loaded / 4) * 100) + '%';
                resolve(true); };
            const fail = () => { if (done) return; done = true; resolve(false); };

            v.addEventListener('canplaythrough', ok, { once: true });
            v.addEventListener('error', fail, { once: true });
            const srcEl = v.querySelector('source');
            if (srcEl) srcEl.addEventListener('error', fail, { once: true });
            setTimeout(fail, 10000);
            v.load();
        });
        const results = await Promise.all(allVideos.map(settle));

        videoEN.addEventListener('ended', showEnd);
        videoES.addEventListener('ended', showEnd);
        videoJA.addEventListener('ended', showEnd);
        
        // Double click fullscreen
        videoFrame.addEventListener('dblclick', toggleFullscreen);
    }

    function start() {
        startOverlay.classList.add('hidden');
        player.classList.add('active');
        langSwitcher.classList.add('visible');
        glass.classList.add('visible');
        // NO AUTOPLAY - user must click play button
    }

    // === BLEND SLIDER ===
    function startDrag(e) {
        if (e.target.closest('.controls') || e.target.closest('.btn')) return;
        isDragging = true;
        videoFrame.classList.add('dragging');
        drag(e);
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();
        
        const rect = videoFrame.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        blendPos = Math.max(0, Math.min(100, (x / rect.width) * 100));
        
        divider.style.left = blendPos + '%';
        
        // Update clip-path on all enhanced videos
        // Clip from LEFT by blendPos% - shows right portion (enhanced on right)
        // blendPos=50 means: inset(0 0 0 50%) = left half clipped, right half visible
        const clip = `inset(0 0 0 ${blendPos}%)`;
        videoEN.style.clipPath = clip;
        videoES.style.clipPath = clip;
        videoJA.style.clipPath = clip;
        document.querySelectorAll('.archive-enhanced').forEach(el => { el.style.clipPath = clip; });
    }

    // === ARCHIVE MODE ===
    // When the hosted footage is unreachable, the app becomes a stills
    // comparator over the locally-committed restoration frames — the same
    // divider-drag interaction, zero network dependencies.
    const ARCHIVE_FRAMES = {
        realesrgan: { '3': 'comparison_frames/realesrgan_3s.png', '8': 'comparison_frames/realesrgan_8s.png' },
        topaz:      { '3': 'comparison_frames/topaz_3s.png',      '8': 'comparison_frames/topaz_8s.png' },
        source:     { '3': 'comparison_frames/source_3s.png',     '8': 'comparison_frames/source_8s.png' }
    };
    let archiveState = { model: 'realesrgan', t: '8' };

    function enterArchiveMode() {
        document.body.classList.add('archive-mode');
        [videoOriginal, videoEN, videoES, videoJA].forEach(v => { v.remove(); });

        const base = document.createElement('img');
        base.className = 'video-layer archive-base';
        base.alt = 'Original VHS frame';
        const enh = document.createElement('img');
        enh.className = 'video-layer enhanced-layer archive-enhanced';
        enh.alt = 'Restored frame';
        const frame = document.getElementById('videoFrame');
        frame.prepend(enh); frame.prepend(base);

        const chips = document.createElement('div');
        chips.className = 'archive-chips';
        chips.innerHTML = `
            <span class="archive-note">ARCHIVE STILLS — full footage returns soon</span>
            <div class="archive-group" role="group" aria-label="Frame time">
                <button class="archive-chip" data-t="3">0:03</button>
                <button class="archive-chip active" data-t="8">0:08</button>
            </div>
            <div class="archive-group" role="group" aria-label="Restoration model">
                <button class="archive-chip active" data-model="realesrgan">Real-ESRGAN</button>
                <button class="archive-chip" data-model="topaz">Topaz</button>
            </div>`;
        document.getElementById('player').appendChild(chips);
        chips.addEventListener('click', e => {
            const b = e.target.closest('.archive-chip');
            if (!b) return;
            if (b.dataset.t) { archiveState.t = b.dataset.t;
                chips.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('active', x === b)); }
            if (b.dataset.model) { archiveState.model = b.dataset.model;
                chips.querySelectorAll('[data-model]').forEach(x => x.classList.toggle('active', x === b)); }
            applyArchiveFrames();
        });

        function applyArchiveFrames() {
            base.src = ARCHIVE_FRAMES.source[archiveState.t];
            enh.src = ARCHIVE_FRAMES[archiveState.model][archiveState.t];
            enh.style.clipPath = `inset(0 0 0 ${blendPos}%)`;
        }
        applyArchiveFrames();

        const enhancedLabel = document.getElementById('enhancedLabel');
        if (enhancedLabel) enhancedLabel.textContent = 'RESTORED · STILL';
        const langSwitcher = document.getElementById('langSwitcher');
        if (langSwitcher) langSwitcher.style.display = 'none';
        const subtitleLine = document.getElementById('subtitleLine');
        if (subtitleLine) subtitleLine.textContent = '"The Jail Speech" — restoration archive';
    }

    function endDrag() {
        isDragging = false;
        videoFrame.classList.remove('dragging');
    }

    // === PLAYBACK ===
    function togglePlay() {
        if (isPlaying) {
            pause();
        } else {
            play();
        }
    }

    function play() {
        videoOriginal.play();
        currentVideo.play();
        isPlaying = true;
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
    }

    function pause() {
        videoOriginal.pause();
        currentVideo.pause();
        isPlaying = false;
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
    }

    function seek(secs) {
        const dur = DURATIONS[currentLang];
        const t = Math.max(0, Math.min(dur, currentVideo.currentTime + secs));
        
        currentVideo.currentTime = t;
        
        // Sync original using percentage
        const pct = t / dur;
        videoOriginal.currentTime = pct * DURATIONS.original;
        
        seekFlash.textContent = secs > 0 ? `+${secs}s` : `${secs}s`;
        seekFlash.classList.add('show');
        setTimeout(() => seekFlash.classList.remove('show'), 300);
    }

    function seekToPos(e) {
        const rect = progressTrack.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        
        const dur = DURATIONS[currentLang];
        currentVideo.currentTime = pct * dur;
        videoOriginal.currentTime = pct * DURATIONS.original;
    }

    function onTimeUpdate() {
        if (isSwitching) return;
        
        const t = currentVideo.currentTime;
        const dur = DURATIONS[currentLang];
        const pct = t / dur;
        
        progressFill.style.width = (pct * 100) + '%';
        timeDisplay.textContent = `${fmt(t)} / ${fmt(dur)}`;
        
        // Keep original synced (percentage-based)
        const origTarget = pct * DURATIONS.original;
        if (Math.abs(videoOriginal.currentTime - origTarget) > 0.3) {
            videoOriginal.currentTime = origTarget;
        }
        
        updateSubtitles(pct);
    }

    function fmt(s) {
        if (!s || isNaN(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    // === SUBTITLES ===
    function updateSubtitles(pct) {
        const subs = SUBTITLES[currentLang];
        
        // Find current subtitle
        let subIdx = -1;
        for (let i = 0; i < subs.length; i++) {
            if (pct >= subs[i].pct && pct <= subs[i].end) {
                subIdx = i;
                break;
            }
        }
        
        if (subIdx === -1) {
            if (subtitleLine.textContent !== '') {
                subtitleLine.textContent = '';
                lastSubIdx = -1;
            }
            return;
        }
        
        // Only update DOM if subtitle changed
        if (subIdx !== lastSubIdx) {
            lastSubIdx = subIdx;
            subtitleLine.textContent = subs[subIdx].text;
        }
    }

    // === VOLUME ===
    function toggleMute() {
        currentVideo.muted = !currentVideo.muted;
        iconVol.style.display = currentVideo.muted ? 'none' : 'block';
        iconMute.style.display = currentVideo.muted ? 'block' : 'none';
    }

    function updateVolume() {
        const vol = volSlider.value / 100;
        videoEN.volume = vol;
        videoES.volume = vol;
        videoJA.volume = vol;
        
        iconVol.style.display = vol === 0 ? 'none' : 'block';
        iconMute.style.display = vol === 0 ? 'block' : 'none';
    }

    // === LANGUAGE SWITCH (PERCENTAGE-BASED WITH CROSSFADE) ===
    async function switchLang(lang) {
        if (lang === currentLang || isSwitching) return;
        
        isSwitching = true;
        const wasPlaying = isPlaying;
        
        // Calculate percentage position in current video
        const pct = currentVideo.currentTime / DURATIONS[currentLang];
        
        // Mark buttons
        langBtns.forEach(b => b.classList.toggle('switching', b.dataset.lang !== lang));
        
        // Show language indicator
        langFlash.textContent = langLabels[lang];
        langFlash.classList.add('show');
        
        // Pause current
        if (wasPlaying) pause();
        
        // Get new video
        const newVideo = videos[lang];
        const newTime = pct * DURATIONS[lang];
        
        // Seek new video
        newVideo.currentTime = newTime;
        
        // Wait for seek to complete
        await new Promise(resolve => {
            const check = () => {
                if (Math.abs(newVideo.currentTime - newTime) < 0.5 || newVideo.readyState >= 3) {
                    resolve();
                } else {
                    requestAnimationFrame(check);
                }
            };
            newVideo.addEventListener('seeked', resolve, { once: true });
            setTimeout(resolve, 300); // Timeout fallback
            check();
        });
        
        // Crossfade: show new, hide old
        // Clip from LEFT - enhanced video shows on RIGHT side
        const clip = `inset(0 0 0 ${blendPos}%)`;
        newVideo.style.clipPath = clip;
        newVideo.classList.remove('hidden');
        
        // Brief overlap then hide old
        await new Promise(r => setTimeout(r, 50));
        currentVideo.classList.add('hidden');
        
        // Update state
        const oldVideo = currentVideo;
        currentVideo = newVideo;
        currentLang = lang;
        lastSubIdx = -1;
        
        // Update label
        enhancedLabel.textContent = langLabels[lang];
        
        // Update buttons
        langBtns.forEach(b => {
            b.classList.toggle('active', b.dataset.lang === lang);
            b.classList.remove('switching');
        });
        
        // Remove flash
        setTimeout(() => langFlash.classList.remove('show'), 400);
        
        // Resume
        if (wasPlaying) {
            play();
        }
        
        isSwitching = false;
    }

    // === ENDING ===
    function showEnd() {
        glass.classList.remove('visible');
        endOverlay.classList.add('visible');
        pause();
    }

    function replay() {
        endOverlay.classList.remove('visible');
        glass.classList.add('visible');
        
        // Reset all videos
        videoOriginal.currentTime = 0;
        videoEN.currentTime = 0;
        videoES.currentTime = 0;
        videoJA.currentTime = 0;
        lastSubIdx = -1;
        
        setTimeout(() => play(), 200);
    }

    // === KEYBOARD ===
    function handleKey(e) {
        if (e.target.tagName === 'INPUT') return;
        
        switch(e.code) {
            case 'Space':
                e.preventDefault();
                if (!startOverlay.classList.contains('hidden')) {
                    start();
                } else {
                    togglePlay();
                }
                break;
            case 'ArrowLeft':
                e.preventDefault();
                seek(-5);
                break;
            case 'ArrowRight':
                e.preventDefault();
                seek(5);
                break;
            case 'KeyM':
                toggleMute();
                break;
            case 'KeyF':
                toggleFullscreen();
                break;
            case 'Digit1':
                switchLang('en');
                break;
            case 'Digit2':
                switchLang('es');
                break;
            case 'Digit3':
                switchLang('ja');
                break;
        }
    }

    function toggleFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else {
            document.documentElement.requestFullscreen();
        }
    }

    // GO
    init();
    </script>
</body>
</html>
