name: Static site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: art-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install pinned test dependency
        run: npm ci
      - name: Install Chromium for the browser canary
        run: npx playwright install --with-deps chromium
      - name: Verify static integrity and representative browser behavior
        run: npm test
