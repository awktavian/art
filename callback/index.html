<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAFAF8">
    <title>Tesla Authorization</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #FAFAF8; --ink: #1A1A1A; --ink-dim: #565049;
            --line: rgba(26,26,26,.12); --accent: #0E6E7A;
            --ok: #2D8A52; --err: #B3261E;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--ink);
            max-width: 560px; margin: 0 auto; padding: 48px 24px;
            font-size: 18px; line-height: 1.8;
        }
        .card {
            border: 1px solid var(--line); border-radius: 12px;
            padding: 32px; margin-top: 24px;
        }
        h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
        .state-note { color: var(--ink-dim); margin: 0 0 24px; }
        .ok h1 { color: var(--ok); }
        .err h1 { color: var(--err); }
        code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 15px; background: rgba(26,26,26,.04);
            border: 1px solid var(--line); border-radius: 8px;
            padding: 14px 16px; display: block; word-break: break-all;
            user-select: all;
        }
        button {
            font: 500 16px/1 'Inter', system-ui, sans-serif;
            color: #fff; background: var(--accent);
            border: 0; border-radius: 8px; padding: 14px 22px;
            margin-top: 16px; cursor: pointer;
            transition: transform 89ms cubic-bezier(0.34, 1.56, 0.64, 1), background 144ms ease;
        }
        button:hover { background: #0c5d67; }
        button:active { transform: scale(0.97); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        button[data-copied] { background: var(--ok); }
        .hidden { display: none; }
        @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
</head>
<body>
    <main class="card" id="card">
        <div id="state-ok" class="ok hidden">
            <h1>Authorization complete</h1>
            <p class="state-note">Paste this code back into your setup session to finish connecting the car.</p>
            <code id="code"></code>
            <button id="copy">Copy code</button>
        </div>
        <div id="state-missing" class="err hidden">
            <h1>No authorization code</h1>
            <p class="state-note">This page expects Tesla to redirect here with a <code style="display:inline;padding:2px 6px">?code=…</code> parameter. Start the authorization again from your setup session.</p>
        </div>
        <div id="state-error" class="err hidden">
            <h1>Authorization failed</h1>
            <p class="state-note" id="err-detail"></p>
        </div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const show = id => document.getElementById(id).classList.remove('hidden');

        if (error) {
            show('state-error');
            document.getElementById('err-detail').textContent =
                `Tesla reported: ${error}${params.get('error_description') ? ' — ' + params.get('error_description') : ''}. Start the authorization again.`;
        } else if (code) {
            show('state-ok');
            document.getElementById('code').textContent = code;
            const btn = document.getElementById('copy');
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(code);
                    btn.textContent = 'Copied';
                    btn.setAttribute('data-copied', '');
                    if (navigator.vibrate) navigator.vibrate(8);
                    setTimeout(() => {
                        btn.textContent = 'Copy code';
                        btn.removeAttribute('data-copied');
                    }, 1440);
                } catch {
                    const r = document.createRange();
                    r.selectNodeContents(document.getElementById('code'));
                    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
                }
            });
        } else {
            show('state-missing');
        }
    </script>
</body>
</html>
