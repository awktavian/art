app = "kagami-realtime-proxy"
primary_region = "sjc"

# server.js refuses to start without these; there is no built-in default model
# and no built-in price table. Model id and its prices travel together, because
# a price attached to the wrong model silently mis-meters SESSION_COST_CAP.
#
# Source: https://developers.openai.com/api/docs/pricing, read 2026-09-04.
# `gpt-4o-realtime-preview` — the id this file previously defaulted to in code —
# is no longer listed on that page, which is exactly why the default was removed.
[env]
  REALTIME_MODEL = "gpt-realtime"
  REALTIME_PRICE_TEXT_IN_PER_MTOK = "4.00"
  REALTIME_PRICE_TEXT_OUT_PER_MTOK = "24.00"
  REALTIME_PRICE_AUDIO_IN_PER_MTOK = "32.00"
  REALTIME_PRICE_AUDIO_OUT_PER_MTOK = "64.00"

[build]

[http_service]
  internal_port = 8766
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
